plugins {
    id 'com.android.application'
}

android {
    namespace 'com.agy'
    compileSdk 34

    defaultConfig {
        applicationId "com.geminip"
        minSdk 24
        targetSdk 28
        versionCode 16
        versionName "2.4.0"
        multiDexEnabled false
        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }

    signingConfigs {
        debug {
            def keystoreFile = file('../tools/debug.keystore')
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig false
    }

    // Large runtime binaries (language_server.so is 173MB) and archives
    // must not be compressed in Java memory to prevent 'Java heap space' OOM
    androidResources {
        noCompress 'so', 'gz', 'tgz', 'zip', 'png', 'crt', 'pbtxt'
    }
    aaptOptions {
        noCompress 'so', 'gz', 'tgz', 'zip', 'png', 'crt', 'pbtxt'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Pure native Android framework APIs
}
